<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ユーザー登録フォーム</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-gray-100 flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full">
            <h1 class="text-xl font-bold mb-6">👤ユーザー登録👤</h1>

            <form id="signupForm" class="space-y-4" novalidate>
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">名前</label>
                    <input type="text" id="name" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="山田花子">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">メールアドレス</label>
                    <input type="email" id="email" required class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="example@gmail.com">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
                    <input type="password" id="password" required minlength="8" class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                </div>  
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="agree">
                    <label for="agree" class="text-sm text-gray-700">利用規約に同意する</label>
                </div>   
                <p id="message" class="text-sm font-medium"></p>
                
                <button type="submit" class="w-full bg-blue-600 text-white font-bold rounded hover:bg-blue-700 p-2">登録する</button>
            </form> 
        </div>      

        <script>
            const form = document.getElementById("signupForm");
            const message = document.getElementById("message");

            form.addEventListener("submit", (event) => {
                event.preventDefault();

                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const agree = document.getElementById("agree").checked;

                if (!document.getElementById("email").validity.valid) {
                message.textContent = "正しいメールアドレスを入力してください。";
                message.className = "text-sm font-medium text-red-500";
                return;
                }
                if (!name || !email || !password) {
                    message.textContent = "すべてのフィールドを入力してください。";
                    message.className = "text-sm font-medium text-red-500";
                    return;
                }

                if (password.length < 8) {
                    message.textContent = "パスワードは8文字以上で入力してください";
                    message.className = "text-sm font-medium text-red-500";
                    return;
                }

                if (!agree) {
                    message.textContent = "利用規約に同意してください。";
                    message.className = "text-sm font-medium text-red-500";
                    return;
                }

                message.textContent = "登録完了！ようこそ、" + name + "さん！";
                message.className = "text-sm font-medium text-green-500";

                form.reset();
            });
        </script>
    </body>
</html>
